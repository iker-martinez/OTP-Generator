<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar OTP</title>
    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <!-- Sweet Alert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css">
    
    <!-- CREO QUE YA NO ES NECESARIO -->
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"></script>

</head>

<body onload="initial();">

    <div class="container">
        <div class="m-0 vh-100 row justify-content-around align-items-center">
            <div class="col-md-5 display">
                <div class="half-width">
                    <p class="lblTitle">Generar OTP</p>
                    <input id="ipGenerated" class="form-control ipGenerated" type="text" readonly
                        onmousedown="return false;">
                    <button id="btnGenerate" class="button" onclick="startInterval()">Generar</button>
                    <p class="TimeLeft" id="lblTimeLeft"></p>
                </div>
            </div>
            <div class="col-md-5 display">
                <div class="half-width">
                    <p class="lblTitle">Validar OTP</p>
                    <input id="ipValidated" class="ipValidated" type="text" maxlength="6">
                    <button id="btnValidate" class="button" onclick="validateOTP()">Validar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="scripts.js" defer></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap/dist/js/bootstrap.min.js"></script>

</body>

</html>
